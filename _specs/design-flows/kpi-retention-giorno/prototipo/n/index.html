<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retention</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#22262f;--line:#2a2f3a;--step:#0a0c10;--text:#fff;--muted:#8b93a7;--dim:#5b6274;--blue:#4361EE;--blue2:#7b8ff5;--orange:#FF8A00;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;padding:32px 40px 48px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}
.top h1{font-size:30px;font-weight:900;letter-spacing:-.01em}
.top p{color:var(--muted);font-size:14px;font-weight:600;margin-top:4px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--step);color:var(--muted);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:800;transition:transform .08s,box-shadow .08s}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--step)}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 3px 0 #2a3fae}
.card{background:var(--card);border:1.5px solid var(--line);box-shadow:0 4px 0 var(--step);border-radius:20px;padding:24px 26px}
.lab{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.huge{font-size:64px;font-weight:900;line-height:1;letter-spacing:-.02em}
.big{font-size:40px;font-weight:900;line-height:1}
.sub{color:var(--muted);font-size:14px;font-weight:600;margin-top:8px}
.sub b{color:var(--text)}
.leg{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted);margin-top:14px}
.leg span{display:inline-flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.ln{width:20px;height:0;border-top:3px solid;display:inline-block}
.row{display:grid;gap:16px}
.skel{background:var(--card);border-radius:20px;animation:b 1.1s ease-in-out infinite alternate}
@keyframes b{from{opacity:.4}to{opacity:1}}
.seg{display:inline-flex;background:var(--card2);border-radius:999px;padding:4px}
.seg button{background:none;border:0;color:var(--muted);font-weight:800;font-size:13px;padding:7px 16px;border-radius:999px}
.seg button.on{background:var(--orange);color:#111}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;display:none;z-index:9}
svg text{font-family:Nunito,sans-serif;font-weight:700}
</style></head><body>
<div id="app"></div><div class="tip" id="tip"></div>
<script src="v2data.js"></script><script src="extra.js"></script>
<script>
const Q = new URLSearchParams(location.search), P = Q.get('p') || '23a', STATO = Q.get('stato') || 'dati';
const V = window.__V2.sprints;
const S12='117f7936-4149-4ce9-9fac-265835b40530', S14='157651b5-acf1-416f-9793-8587f724e2cd', S16='2f1c3280-246d-4460-b281-fa466d7c11d5', S18='f56ceabe-1aa3-44c0-b592-a3210dc56715', S19='766f4019-7e88-41ab-8cc1-b105ca86dbc2';
const short = n => n.replace(' - Test Rate + Mascotte', '').replace('Spint', 'Sprint').replace('sprint', 'Sprint');
const pc = (a, n) => n ? a / n * 100 : null;
const f = v => v == null ? '—' : v.toFixed(1).replace('.', ',') + '%';
const st = { sp: STATO === 'vuoto' ? S19 : P === '23b' ? null : S12, m: 'works', cmp: true };
const $ = id => document.getElementById(id);

function axes(o) {
  // o: {W,H,L,R,T,B,xN,xLab(i),xTick(i),yMax,ySteps,yFmt}
  const { W, H, L, R, T, B } = o; let g = '';
  const xOf = i => L + i / (o.xN - 1) * (W - L - R), yOf = v => T + (1 - v / o.yMax) * (H - T - B);
  for (let i = 0; i <= o.ySteps; i++) { const v = o.yMax / o.ySteps * i, y = yOf(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#2a2f3a"/><text x="${L - 10}" y="${y + 4}" text-anchor="end" font-size="12" fill="#8b93a7">${o.yFmt(v)}</text>`; }
  for (let i = 0; i < o.xN; i++) { const x = xOf(i), lab = o.xLab(i);
    g += `<line x1="${x}" x2="${x}" y1="${H - B}" y2="${H - B + (lab ? 7 : 4)}" stroke="#5b6274"/>`;
    if (lab) g += `<text x="${x}" y="${H - B + 22}" text-anchor="middle" font-size="12" fill="#8b93a7">${lab}</text>`; }
  return { g, xOf, yOf };
}
const pathOf = (pts, xOf, yOf) => pts.map(([i, v], k) => (k ? 'L' : 'M') + xOf(i).toFixed(1) + ' ' + yOf(v).toFixed(1)).join(' ');
const hot = (x, y, txt) => `<circle cx="${x}" cy="${y}" r="9" fill="transparent" data-tip="${txt}"/>`;
const pills = (ids, cur) => `<div class="pills">${ids.map(id => `<button class="pill ${id === cur ? 'on' : ''}" data-sp="${id}">${short(V[id].nome)}</button>`).join('')}</div>`;
const header = (t, p, right) => `<div class="top"><div><h1>${t}</h1><p>${p}</p></div>${right || ''}</div>`;
function guard() {
  if (STATO === 'carica') return `<div class="row" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">${'<div class="skel" style="height:130px"></div>'.repeat(3)}</div><div class="skel" style="height:440px"></div>`;
  if (STATO === 'errore') return `<div class="card" style="max-width:560px"><div class="lab" style="color:var(--red)">Calcolo non arrivato</div><div class="big" style="font-size:24px;margin:10px 0 6px">Il database ci ha messo troppo.</div><div class="sub">I dati sono al sicuro, è solo il calcolo che non è tornato.</div><button class="pill on" style="margin-top:18px" data-toast="Riprovo">Riprova</button></div>`;
  return null;
}
function young(id) { const s = V[id]; return `<div class="card" style="max-width:640px"><div class="lab">${short(s.nome)} · ${s.n} persone</div><div class="big" style="font-size:28px;margin:12px 0 8px">Nessuno ha ancora vissuto il giorno 1.</div><div class="sub">Il primo ritorno si misura domani. Intanto guarda uno sprint già maturo.</div></div>`; }

// ── 23A — La coorte in tre fasce ──
function r23a() {
  const ids = [S12, S16, S19];
  let body = guard();
  if (!body && V[st.sp].md < 1) body = young(st.sp);
  if (!body) {
    const s = V[st.sp], b = window.__BANDS[st.sp], md = Math.min(30, s.md), n = s.n;
    const W = 1160, H = 420, L = 54, R = 16, T = 16, B = 40, yMax = 20;
    const A = axes({ W, H, L, R, T, B, xN: md, xLab: i => (i === 0 || (i + 1) % 5 === 0) ? 'G' + (i + 1) : '', yMax, ySteps: 4, yFmt: v => v + '%' });
    const wv = b.slice(1, md + 1).map(r => pc(r[1], n)), ov = b.slice(1, md + 1).map(r => pc(r[1] + r[2], n));
    const top = ov.map((v, i) => [i, v]), bot = wv.map((v, i) => [i, v]);
    const area = (up, lo, c, op) => `<path d="${pathOf(up, A.xOf, A.yOf)} L ${lo.slice().reverse().map(([i, v]) => A.xOf(i).toFixed(1) + ' ' + A.yOf(v).toFixed(1)).join(' L ')} Z" fill="${c}" fill-opacity="${op}"/>`;
    const zero = wv.map((v, i) => [i, 0]);
    let g = A.g + area(top, bot, '#4361EE', .55) + area(bot, zero, '#FF8A00', .9);
    g += `<path d="${pathOf(top, A.xOf, A.yOf)}" fill="none" stroke="#7b8ff5" stroke-width="2"/>`;
    if (st.cmp && st.sp !== S16) { const c = V[S16], cb = window.__BANDS[S16]; const cp = cb.slice(1).map((r, i) => [i, pc(r[1] + r[2], c.n)]).filter(([i]) => i < md); g += `<path d="${pathOf(cp, A.xOf, A.yOf)}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 5"/>`; }
    b.slice(1, md + 1).forEach((r, i) => { g += hot(A.xOf(i), A.yOf(ov[i]), `Giorno ${i + 1}: ${r[1] + r[2]} tornati · ${r[1]} si allenano · ${r[2]} aprono e basta`); });
    const d = k => b[k] || [k, 0, 0];
    const big = (k, lab) => `<div class="card"><div class="lab">${lab}</div><div style="display:flex;align-items:baseline;gap:14px;margin-top:12px"><div class="huge">${d(k)[1] + d(k)[2]}</div><div class="sub" style="margin:0">su ${n} tornano</div></div><div class="sub"><b style="color:var(--orange)">${d(k)[1]}</b> si allenano · <b style="color:var(--blue2)">${d(k)[2]}</b> aprono e basta</div></div>`;
    body = `<div class="row" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">${big(1, 'Il giorno dopo')}${big(7, 'Dopo una settimana')}${md >= 30 ? big(30, 'Dopo un mese') : big(md, 'Al giorno ' + md + ', l\'ultimo visto')}</div>
      <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div class="lab">Chi c'è, giorno per giorno</div>
      ${st.sp !== S16 ? `<button class="pill ${st.cmp ? 'on' : ''}" data-cmp>Confronta con Sprint 16</button>` : ''}</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:14px">${g}</svg>
      <div class="leg"><span><i class="sw" style="background:#FF8A00"></i>si allena</span><span><i class="sw" style="background:#4361EE;opacity:.7"></i>apre l'app e basta</span>${st.cmp && st.sp !== S16 ? '<span><i class="ln" style="border-color:#fff;border-top-style:dashed"></i>tornati in Sprint 16</span>' : ''}<span>quota sul totale di ${n} persone</span></div></div>`;
  }
  return header('Chi torna', 'Di tutte le persone arrivate nello sprint, quante ci sono ogni giorno e quante si allenano.', pills(ids, st.sp)) + body;
}

// ── 23B — Ogni giorno, chi c'è (calendario) ──
function r23b() {
  let body = guard();
  if (!body && STATO === 'vuoto') body = `<div class="card" style="max-width:640px"><div class="big" style="font-size:28px;margin-bottom:8px">Ancora nessuna giornata completa.</div><div class="sub">Il primo giorno intero si vede domattina.</div></div>`;
  if (!body) {
    const C = window.__CAL, N = C.length, W = 1160, H = 420, L = 54, R = 16, T = 16, B = 40, yMax = 200;
    const lab = i => { const d = C[i][0].slice(8); return (i % 7 === 0 || i === N - 1) ? +d + '/' + C[i][0].slice(5, 7) : ''; };
    const A = axes({ W, H, L, R, T, B, xN: N, xLab: lab, yMax, ySteps: 4, yFmt: v => v });
    let g = '';
    window.__SPRINTCAL.forEach(([nm, a, z]) => { const i0 = C.findIndex(r => r[0] >= a), i1 = C.map(r => r[0] <= z).lastIndexOf(true); if (i0 < 0 || i1 < 0) return; const x0 = Math.max(L, A.xOf(i0) - 8), x1 = A.xOf(i1) + 8; g += `<rect x="${x0}" y="${T}" width="${x1 - x0}" height="${H - T - B}" fill="#fff" fill-opacity=".035" rx="6"/><text x="${(x0 + x1) / 2}" y="${T + 16}" text-anchor="middle" font-size="11" fill="#5b6274">${short(nm)}</text>`; });
    g += A.g;
    const act = C.map((r, i) => [i, r[1]]), ret = C.map((r, i) => [i, Math.max(0, r[1] - r[2])]), tr = C.map((r, i) => [i, r[3]]);
    g += `<path d="${pathOf(act, A.xOf, A.yOf)} L ${A.xOf(N - 1)} ${A.yOf(0)} L ${A.xOf(0)} ${A.yOf(0)} Z" fill="#4361EE" fill-opacity=".18"/>`;
    g += `<path d="${pathOf(act, A.xOf, A.yOf)}" fill="none" stroke="#7b8ff5" stroke-width="2"/>`;
    g += `<path d="${pathOf(ret, A.xOf, A.yOf)}" fill="none" stroke="#fff" stroke-width="2.5"/>`;
    g += `<path d="${pathOf(tr, A.xOf, A.yOf)}" fill="none" stroke="#FF8A00" stroke-width="3"/>`;
    C.forEach((r, i) => { g += hot(A.xOf(i), A.yOf(r[1]), `${r[0].slice(8)}/${r[0].slice(5, 7)}: ${r[1]} attivi · ${r[2]} nuovi · ${Math.max(0, r[1] - r[2])} tornati · ${r[3]} si allenano`); });
    const last = C[N - 1], wk = C.slice(-7), avg = k => Math.round(wk.reduce((a, r) => a + (k === 'r' ? Math.max(0, r[1] - r[2]) : r[k]), 0) / 7);
    const prev = C.slice(-14, -7), avgP = k => Math.round(prev.reduce((a, r) => a + (k === 'r' ? Math.max(0, r[1] - r[2]) : r[k]), 0) / 7);
    const delta = (a, b) => { const d = a - b; return `<span style="color:${d >= 0 ? 'var(--green)' : 'var(--red)'}">${d >= 0 ? '+' : ''}${d}</span> sulla settimana prima`; };
    const k = (lab, v, s, c) => `<div class="card"><div class="lab">${lab}</div><div class="huge" style="margin-top:12px;color:${c || '#fff'}">${v}</div><div class="sub">${s}</div></div>`;
    body = `<div class="row" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
      ${k('Attivi al giorno', avg(1), 'media degli ultimi 7 giorni · ' + delta(avg(1), avgP(1)))}
      ${k('Tornati, non nuovi', avg('r'), 'media 7 giorni · ' + delta(avg('r'), avgP('r')))}
      ${k('Si allenano', avg(3), 'media 7 giorni · ' + delta(avg(3), avgP(3)), 'var(--orange)')}</div>
      <div class="card"><div class="lab">Persone attive ogni giorno</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:14px">${g}</svg>
      <div class="leg"><span><i class="ln" style="border-color:#7b8ff5"></i>aprono l'app</span><span><i class="ln" style="border-color:#fff"></i>di cui tornati (non al primo avvio)</span><span><i class="ln" style="border-color:#FF8A00"></i>completano un workout</span><span><i class="sw" style="background:#fff;opacity:.08"></i>periodo di uno sprint</span></div></div>`;
  }
  return header('Chi c\'è ogni giorno', 'Persone attive sul calendario, dal 5 ottobre a ieri. Non dipende dallo sprint.', '') + body;
}

// ── 23C — Tutti gli sprint, uno in luce ──
function r23c() {
  const ids = [S12, S14, S16, S18, S19];
  let body = guard();
  if (!body && V[st.sp].md < 1) body = young(st.sp);
  if (!body) {
    const s = V[st.sp], key = st.m, W = 1160, H = 400, L = 54, R = 16, T = 16, B = 40, yMax = key === 'opens' ? 20 : 8;
    const A = axes({ W, H, L, R, T, B, xN: 30, xLab: i => (i === 0 || (i + 1) % 5 === 0) ? 'G' + (i + 1) : '', yMax, ySteps: 4, yFmt: v => v + '%' });
    let g = A.g;
    const line = (id, c, w, dash) => { const x = V[id], pts = []; for (let d = 1; d <= Math.min(30, x.md); d++) { const v = pc(x[key][d], x.n); if (v <= yMax) pts.push([d - 1, v]); } return pts.length > 1 ? `<path d="${pathOf(pts, A.xOf, A.yOf)}" fill="none" stroke="${c}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''} stroke-linejoin="round"/>` : ''; };
    ids.filter(id => id !== st.sp).forEach(id => g += line(id, '#5b6274', 1.5));
    if (key === 'opens') { const bm = []; for (let d = 1; d <= 30; d++) bm.push([d - 1, d <= 7 ? 20 + (8 - 20) * (d - 1) / 6 : 8 + (3.5 - 8) * (d - 7) / 23]); g += `<path d="${pathOf(bm, A.xOf, A.yOf)}" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 5"/>`; }
    g += line(st.sp, '#FF8A00', 3.5);
    for (let d = 1; d <= Math.min(30, s.md); d++) { const v = pc(s[key][d], s.n); if (v <= yMax) g += `<circle cx="${A.xOf(d - 1)}" cy="${A.yOf(v)}" r="3.5" fill="#FF8A00"/>` + hot(A.xOf(d - 1), A.yOf(v), `Giorno ${d}: ${s[key][d]} di ${s.n} (${f(v)})`); }
    const at = d => d <= s.md ? f(pc(s[key][d], s.n)) : '—';
    const best = d => { let b = null; ids.forEach(id => { const x = V[id]; if (d <= x.md) { const v = pc(x[key][d], x.n); if (!b || v > b.v) b = { v, id }; } }); return b; };
    const step = (d, lab) => { const b = best(d), mine = b && b.id === st.sp; return `<div class="card"><div class="lab">${lab}</div><div class="huge" style="margin-top:12px;color:${mine ? 'var(--orange)' : '#fff'}">${at(d)}</div><div class="sub">${d <= s.md ? (mine ? '<b style="color:var(--orange)">Il migliore</b> fra gli sprint' : `il migliore è <b>${b ? short(V[b.id].nome) + ' · ' + f(b.v) : '—'}</b>`) : 'non ancora vissuto'}</div></div>`; };
    body = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="seg"><button class="${key === 'opens' ? 'on' : ''}" data-m="opens">Aprono l'app</button><button class="${key === 'works' ? 'on' : ''}" data-m="works">Si allenano</button></div>${pills(ids, st.sp)}</div>
      <div class="row" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">${step(1, 'Giorno 1')}${step(7, 'Giorno 7')}${step(30, 'Giorno 30')}</div>
      <div class="card"><div class="lab">${key === 'opens' ? 'Quanti aprono l\'app' : 'Quanti completano un workout'} il giorno N</div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:14px">${g}</svg>
      <div class="leg"><span><i class="ln" style="border-color:#FF8A00"></i>${short(s.nome)}</span><span><i class="ln" style="border-color:#5b6274"></i>gli altri sprint</span>${key === 'opens' ? '<span><i class="ln" style="border-color:#22c55e;border-top-style:dotted"></i>media delle app fitness</span>' : ''}</div></div>`;
  }
  return header('Il ritorno, sprint per sprint', 'Ogni sprint è una curva. Quello scelto è arancione, gli altri restano in grigio per confronto.', '') + body;
}

function draw() { $('app').innerHTML = ({ '23e': () => r23e(), '23a3': () => r23a3(), '23a1': () => r23aV(1), '23a2': () => r23aV(2), '23a': r23a, '23b': r23b, '23c': r23c })[P](); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-sp],[data-m],[data-cmp],[data-toast]'); if (!t) return;
  if (t.dataset.sp) st.sp = t.dataset.sp; if (t.dataset.m) st.m = t.dataset.m; if ('cmp' in t.dataset) st.cmp = !st.cmp;
  draw();
});
document.addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'), tip = $('tip'); if (!t) { tip.style.display = 'none'; return; } tip.textContent = t.dataset.tip; tip.style.display = 'block'; tip.style.left = Math.min(innerWidth - 320, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
</script><script src="a2.js"></script><script src="evdata.js"></script><script src="ev.js"></script><script>draw();</script></body></html>
