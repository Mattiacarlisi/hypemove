<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tribunale di Moovy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#071716">
<meta property="og:title" content="C’è un caso a tuo carico">
<meta property="og:description" content="Il Tribunale di Moovy ti aspetta in aula.">
<meta property="og:image" content="https://hypemove.app/tribunale/og.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@500;700;800;900&display=swap">
<!--
  Tribunale di Moovy: la pagina dove arriva chi commenta un post del Tribunale su Instagram (link nel messaggio privato)
  e chi riceve una «denuncia» da un'amica. È il seguito del Reel, in quattro scene:
    porta → il giudice legge l'accusa e chiede «Come si dichiara?» → risponde a «colpevole» o «innocente» e condanna
    → 30 secondi di movimento coi video dell'app (35 per chi si dichiara innocente) → scarcerazione, scarica l'app o denuncia qualcuno.
  I filmati del giudice (acc-<caso>, colpevole, innocente, libera) sono fatti con lo stesso motore del Reel:
  marketing/creative/animati/tribunale-sito nel repo HypeMove.
  ?c=<caso>  quale reato (lunedi, scarpe, sveglia, palestra); senza, lunedi.
  ?d=1       arriva da una denuncia.
  Pagina statica: scrive visite e tocchi in public.link_page_events (source «tribunale» o «tribunale-den»), anonima come /link.
-->
<style>
:root{--arancio:#f27b0c;--arancio2:#c85f00;--verde:#0f2b2a;--scuro:#071716;--oro:#ffd76a;--carta:#f7ebcf;--legno:#3a2412;--mut:#6d675b}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--scuro)}
body{color:#1d1a15;font-family:Nunito,system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #3a7bff;outline-offset:2px}
.tel{position:relative;width:100%;max-width:480px;height:100dvh;min-height:560px;margin:0 auto;overflow:hidden;background:var(--verde);isolation:isolate}
.sc{position:absolute;inset:0;display:none;flex-direction:column}
.sc.on{display:flex}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--arancio);color:#fff;font-weight:900;font-size:19px;padding:15px 16px;border-radius:18px;border-bottom:5px solid var(--arancio2)}
.btn:active{transform:translateY(2px);border-bottom-width:3px}
.btn.carta{background:var(--carta);color:var(--legno);border-bottom-color:#d3bd88}
.btn.scuro{background:#16403d;color:#fff;border-bottom-color:#0a2423}
.link{font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:8px;text-align:center}
.basso{position:relative;z-index:3;margin-top:auto;padding:0 20px max(22px,env(safe-area-inset-bottom));display:grid;gap:10px}
.sfuma::after{content:"";position:absolute;inset:auto 0 0;height:38%;background:linear-gradient(rgba(7,23,22,0),rgba(7,23,22,.88));pointer-events:none;z-index:2}

/* 1. la porta */
#s-porta{background:radial-gradient(120% 70% at 50% 0,#17423f,var(--scuro) 70%);color:#fff;align-items:center}
.cornice{position:absolute;inset:14% 9% 25%;border:10px solid #2a160a;border-bottom:0;border-radius:14px 14px 0 0;background:#0b0705;overflow:hidden;perspective:900px;box-shadow:0 0 0 3px #4a2a14,0 30px 60px rgba(0,0,0,.6)}
.luce{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 45%,#fff7dc,#ffd76a 40%,#7a4a10 100%);opacity:0;transition:opacity .5s}
.anta{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#4a2a14,#6a3d1e 45%,#55301a);transition:transform .75s cubic-bezier(.6,0,.3,1)}
.anta::before,.anta::after{content:"";position:absolute;left:14%;right:14%;border:3px solid #3a1f0e;border-radius:6px;box-shadow:inset 0 0 0 2px #7a4a26}
.anta::before{top:6%;height:40%}.anta::after{top:52%;height:40%}
.anta.sx{left:0;transform-origin:left center;border-right:2px solid #2a160a}
.anta.dx{right:0;transform-origin:right center;border-left:2px solid #2a160a}
.anta i{position:absolute;top:50%;width:13px;height:44px;border-radius:7px;background:linear-gradient(#ffe9a6,#b98a2b);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.anta.sx i{right:9%}.anta.dx i{left:9%}
.aperta .anta.sx{transform:rotateY(-78deg)}.aperta .anta.dx{transform:rotateY(78deg)}.aperta .luce{opacity:1}
.targa{position:absolute;top:4.5%;left:50%;transform:translateX(-50%);z-index:2;background:linear-gradient(#ffe9a6,#c99a35);color:#3a2412;border-radius:8px;padding:8px 18px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.5);white-space:nowrap}
.targa b{display:block;font-size:21px;line-height:1.1}.targa span{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.avviso{position:relative;z-index:3;margin-top:auto;text-align:center;padding:0 22px 12px}
#s-porta .basso{margin-top:0;width:100%}
.avviso p{margin:0;font-weight:800;font-size:19px;text-wrap:balance}
.avviso small{display:block;color:#bfd6d2;font-weight:700;margin-top:4px}
.pulsa{animation:pulsa 1.3s ease-in-out infinite}
@keyframes pulsa{50%{transform:scale(1.03)}}

/* 2 e 3. il giudice */
#film{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--verde)}
#s-aula{color:#fff}
.scelte{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.entra{animation:entra .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes entra{from{transform:translateY(70px);opacity:0}}
.foglio{background:var(--carta);color:var(--legno);border-radius:20px;padding:16px 16px 18px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.45);transform-origin:50% 0}
.foglio small{font-family:'DM Serif Display',Georgia,serif;font-size:18px;color:#9a5b1d;display:block}
.foglio b{display:block;font:400 34px/1.05 'DM Serif Display',Georgia,serif;margin:4px 0 6px;text-wrap:balance}
.foglio span{font-weight:800}
.cala{animation:cala .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cala{from{transform:translateY(-120px) rotate(-6deg);opacity:0}}
.scossa{animation:scossa .42s}
@keyframes scossa{10%{transform:translate(-9px,5px) rotate(-1deg)}30%{transform:translate(8px,-6px) rotate(1deg)}55%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}

/* 4. la condanna: un gioco a tempo di martello. Una ripetizione a ogni colpo; ogni colpo cancella un pezzo del reato */
#s-gioco{background:#fbf6ea;user-select:none;-webkit-user-select:none}
.gtop{display:flex;justify-content:space-between;align-items:center;padding:max(14px,env(safe-area-inset-top)) 18px 0;font-weight:900}
.gtop span{color:var(--arancio2);letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.gtop button{color:var(--mut);padding:8px 4px;font-weight:800}
.missione{text-align:center;padding:2px 18px 0}
.missione b{display:block;font:400 30px/1.05 'DM Serif Display',Georgia,serif;color:var(--legno);text-wrap:balance}
.missione span{font-weight:800;color:var(--mut);font-size:15px}
.tessere{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:10px 16px 0;min-height:84px;align-content:flex-start}
.tessere i{font-style:normal;font-weight:900;font-size:11px;line-height:1;color:#fff;background:#b3261e;border-radius:6px;padding:6px 0;width:34px;text-align:center;box-shadow:0 2px 0 #7d1711;transition:transform .5s cubic-bezier(.3,0,.8,.4),opacity .5s}
.tessere.grandi i{width:44px;font-size:13px;padding:8px 0}
.tessere i.via{transform:translateY(-80px) rotate(50deg) scale(.3);opacity:0}
.campo{position:relative;width:min(250px,58%);aspect-ratio:1;margin:8px auto 0}
.campo svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tondo{position:absolute;inset:6%;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 8px 0 #d9cfb8,0 14px 24px rgba(58,36,18,.25)}
.tondo.colpo{animation:colpo .28s}
@keyframes colpo{30%{transform:scale(.94) translateY(5px)}}
.campo video{width:100%;height:100%;object-fit:cover;display:block}
.conto{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:104px;color:var(--arancio);background:rgba(251,246,234,.86);border-radius:50%}
.parola{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:var(--legno);color:#fff;font-weight:900;font-size:26px;letter-spacing:.04em;padding:6px 18px;border-radius:99px;white-space:nowrap;box-shadow:0 4px 0 #1f1208}
.parola.batte{animation:parola .3s cubic-bezier(.2,1.7,.4,1)}
@keyframes parola{from{transform:translateX(-50%) scale(1.5)}}
.parola.su{background:var(--arancio);box-shadow:0 4px 0 var(--arancio2)}
.meno{position:absolute;left:50%;top:4%;font-weight:900;font-size:32px;color:#b3261e;pointer-events:none;animation:meno .8s ease-out forwards}
@keyframes meno{from{transform:translate(-50%,0) scale(.6);opacity:0}25%{opacity:1;transform:translate(-50%,-14px) scale(1.2)}to{transform:translate(-50%,-78px) scale(1);opacity:0}}
.tocca{text-align:center;font-weight:900;font-size:16.5px;margin-top:20px;color:var(--legno);padding:0 18px;text-wrap:balance}
.vede{display:flex;align-items:center;gap:8px;margin:8px 26px 0;font-weight:800;font-size:13px;color:var(--mut)}
.vede div{flex:1;height:10px;border-radius:99px;background:#eadfc6;overflow:hidden}
.vede div i{display:block;height:100%;width:100%;background:#22c77f;border-radius:99px;transform-origin:left center;transform:scaleX(0);transition:transform .15s linear}
.giud{margin-top:auto;display:flex;align-items:flex-end;gap:6px;padding:0 12px;height:118px;overflow:hidden}
.giud img{width:140px;display:block;margin-bottom:-24px}
.giud img.salta{animation:salta .3s}
@keyframes salta{40%{transform:translateY(-14px)}}
.fum{position:relative;background:#fff;border-radius:18px 18px 18px 4px;padding:11px 14px;font-weight:800;font-size:16.5px;margin-bottom:40px;min-width:0;box-shadow:0 2px 0 #eadfc6}
.fum.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.fum em{position:absolute;right:-10px;top:-14px;font:900 12px/1 Nunito,sans-serif;font-style:normal;letter-spacing:.08em;color:#c0392b;border:2.5px solid #c0392b;border-radius:6px;padding:4px 6px;transform:rotate(10deg);background:#fff;animation:timbra .3s .35s cubic-bezier(.2,1.6,.4,1) both}
/* il foglio dell'evasione sta al centro: in fondo allo schermo finirebbe sotto la barra del browser */
.eva{position:absolute;inset:0;background:rgba(20,16,10,.6);display:flex;align-items:center;justify-content:center;z-index:6;padding:20px}
.eva>div{background:#fff;width:100%;border-radius:26px;padding:26px 20px 20px;display:grid;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.eva h3{font:400 34px/1 'DM Serif Display',Georgia,serif;margin:0}.eva p{margin:0 0 4px;font-size:17px}

/* 5. la libertà e la denuncia */
#s-fine,#s-denuncia{color:#fff;background:var(--verde) no-repeat center bottom/cover}
.alto{position:relative;z-index:3;padding:max(26px,env(safe-area-inset-top)) 22px 0;text-align:center}
.alto::before{content:"";position:absolute;inset:0 0 -60px;background:linear-gradient(rgba(7,23,22,.9),rgba(7,23,22,0));z-index:-1}
.trib{font:400 17px/1 'DM Serif Display',Georgia,serif;color:#e8c66a}
.grande{font:400 42px/1 'DM Serif Display',Georgia,serif;color:var(--oro);margin:8px 0 8px;text-wrap:balance}
.timbro.due{right:auto;left:-8px;top:-16px;transform:rotate(-10deg);color:#1f7a4a;border-color:#1f7a4a;animation-delay:.95s;animation-name:timbra2}
@keyframes timbra2{from{transform:rotate(-10deg) scale(2.6);opacity:0}}
.timbro{position:absolute;right:-8px;top:-18px;font:900 15px/1 Nunito,sans-serif;letter-spacing:.08em;color:#c0392b;border:3px solid #c0392b;border-radius:8px;padding:6px 9px;transform:rotate(12deg);background:rgba(247,235,207,.6);animation:timbra .35s .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes timbra{from{transform:rotate(12deg) scale(2.6);opacity:0}}
.lista{position:relative;z-index:3;display:grid;gap:9px;padding:18px 20px max(22px,env(safe-area-inset-bottom));overflow:auto;align-content:start;flex:1}
.lista button{background:#fff;color:#1d1a15;border-radius:16px;padding:13px 15px;text-align:left;font-weight:800;line-height:1.2}
.coria{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.coria i{position:absolute;top:-20px;width:9px;height:15px;animation:cade 2.6s linear forwards}
@keyframes cade{to{transform:translateY(110vh) rotate(700deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main class="tel" id="tel">
 <section class="sc" id="s-porta">
  <div class="targa serif"><b>Tribunale di Moovy</b><span>Udienza in corso</span></div>
  <div class="cornice" id="cornice"><div class="luce"></div><div class="anta sx"><i></i></div><div class="anta dx"><i></i></div></div>
  <div class="avviso"><p id="avviso">C’è un caso a tuo carico.</p><small>Alza il volume: il giudice parla.</small></div>
  <div class="basso"><button class="btn pulsa" id="entra">Entra in aula</button></div>
 </section>
 <section class="sc sfuma" id="s-aula">
  <video id="film" playsinline preload="auto"></video>
  <div class="basso" id="aulabasso"></div>
 </section>
 <section class="sc" id="s-gioco">
  <div class="gtop"><span>Condanna in corso</span><button id="salta" type="button">Evado</button></div>
  <div class="missione"><b id="missione"></b><span id="restano"></span></div>
  <div class="tessere" id="tessere"></div>
  <div class="campo"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="none" stroke="#eadfc6" stroke-width="4"/><circle id="arco" cx="50" cy="50" r="47" fill="none" stroke="#22c77f" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="100 100"/></svg><div class="tondo" id="tondo"><video id="vid" muted loop playsinline preload="auto"></video></div><div class="parola" id="parola" hidden></div><div class="conto" id="conto">3</div></div>
  <div class="tocca" id="tocca"></div>
  <div class="vede" id="vede" hidden><span>La corte ti vede</span><div><i id="occhio"></i></div></div>
  <div class="giud"><img src="giudice.webp" alt="Il giudice Moovy ti osserva" id="faccia"><div class="fum" id="fum"></div></div>
  <div class="eva" id="eva" hidden><div><h3>Tentata evasione?</h3><p>Ti mancano <b id="mancano"></b> secondi alla libertà.</p><button class="btn" id="resto" type="button">Torno in cella</button><button class="link" id="evado" type="button">Evado lo stesso</button></div></div>
 </section>
 <section class="sc sfuma" id="s-fine">
  <div class="alto"><div class="trib">Tribunale di Moovy</div><h2 class="grande" id="fint">Scarcerazione</h2></div>
  <div class="basso"><div class="foglio" id="atto" style="position:relative"></div><a class="btn" id="store" href="https://play.google.com/store/apps/details?id=pt.app&hl=it" rel="noopener">Scarica HypeMove</a><button class="btn carta" id="vaidenuncia">Denuncia un complice</button></div>
  <div class="coria" id="coria"></div>
 </section>
 <section class="sc" id="s-denuncia" style="background-image:url(accusa.jpg)">
  <div class="alto"><div class="trib">Nuova denuncia</div><h2 class="grande" style="font-size:36px">Che cosa ha fatto?</h2></div>
  <div class="lista" id="reati"></div>
 </section>
</main>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  // I reati. lei = come si sceglie nella denuncia, d = che cosa si fa, v = video dell'app, f = che cosa dice il giudice mentre guardi
  // I reati. m tessere da cancellare in n colpi di martello; parole = che cosa si legge a ogni colpo; scuse = quelle che il giudice respinge
  var CASI = {
    lunedi: { lei: 'Dice «da lunedì comincio» da quarantadue lunedì.', d: 'di squat', v: 'squat', m: 42, n: 14, tessera: 'LUN', missione: 'Cancella i 42 lunedì', tocca: 'Uno squat a ogni colpo di martello', parole: ['GIÙ', 'SU'], meta: true, scuse: ['«Pioveva.»', '«Era un anno umido.»', '«La tuta è nuova.»', '«Era martedì.»'] },
    scarpe: { lei: 'Ha comprato le scarpe da corsa. Le usa per fare la spesa.', d: 'di marcia, anche da seduti', v: 'marcia', m: 30, n: 30, tessera: '👣', missione: 'Fai i 30 passi mai fatti', tocca: 'Un passo a ogni colpo, anche dalla sedia', parole: ['UNO', 'DUE'], scuse: ['«Sono comode.»', '«Le tengo per l’estate.»', '«Al supermercato si cammina.»', '«Erano in offerta.»'] },
    sveglia: { lei: 'Ha messo la sveglia alle 6. L’ha spenta sette volte.', d: 'di jumping jack', v: 'salti', m: 7, n: 21, tessera: '⏰', grandi: true, missione: 'Spegni le 7 sveglie', tocca: 'Un salto a ogni colpo di martello', parole: ['APRI', 'CHIUDI'], scuse: ['«Ancora cinque minuti.»', '«Era buio.»', '«Ho sognato di allenarmi.»', '«Domani mi alzo.»'] },
    palestra: { lei: 'Paga la palestra da gennaio. Non sa dov’è l’entrata.', d: 'di boxe a vuoto', v: 'boxe', m: 11, n: 22, tessera: ['GEN', 'FEB', 'MAR', 'APR', 'MAG', 'GIU', 'LUG', 'AGO', 'SET', 'OTT', 'NOV'], grandi: true, missione: 'Colpisci 11 mesi di abbonamento', tocca: 'Un pugno a ogni colpo di martello', parole: ['DESTRO', 'SINISTRO'], scuse: ['«Non trovo parcheggio.»', '«C’è troppa gente.»', '«Vado da settembre.»', '«Almeno la pago.»'] }
  };
  var q = new URLSearchParams(location.search);
  var caso = CASI[q.get('c')] ? q.get('c') : 'lunedi', denuncia = q.get('d') === '1';
  var source = denuncia ? 'tribunale-den' : 'tribunale';
  var URL_DB = 'https://fiwskdxntgcredypplub.supabase.co', KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpd3NrZHhudGdjcmVkeXBwbHViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkwMzIxNzAsImV4cCI6MjA2NDYwODE3MH0.W5b8A2zfm0Oeo746SXcANdeRhd2HsAMk5ND9Uc-q7Uo';
  var refHost = null; try { if (document.referrer) refHost = new URL(document.referrer).hostname.slice(0, 100); } catch (e) {}
  // una riga per evento, anonima: view, oppure click con che cosa è stato toccato
  function conta(event, link) {
    try {
      return fetch(URL_DB + '/rest/v1/link_page_events', { method: 'POST', keepalive: true,
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ event: event, link: link || null, source: source, ref_host: refHost, user_agent: (navigator.userAgent || '').slice(0, 400) })
      }).then(function () {}, function () {});
    } catch (e) { return Promise.resolve(); }
  }
  var film = $('#film'), vid = $('#vid'), tick = null, raf = 0, totale = 30, left = 30, paused = false, libera = true, condotta = false, restanti = 0;
  function mostra(k) {
    clearInterval(tick); clearTimeout(tick); cancelAnimationFrame(raf); vid.pause();
    document.querySelectorAll('.sc').forEach(function (s) { s.classList.toggle('on', s.id === 's-' + k); });
  }
  function vibra(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  // un filmato del giudice: parte con l'audio (siamo dentro un tocco), e alla fine chiama «poi»
  function proietta(nome, poi) {
    $('#aulabasso').replaceChildren(); film.loop = false; film.poster = nome + '.jpg';
    if (film.getAttribute('data-nome') !== nome) { film.setAttribute('data-nome', nome); film.src = nome + '.mp4'; }
    film.muted = false; film.currentTime = 0;
    var fatto = false, fine = function () { if (fatto) return; fatto = true; film.onended = film.onerror = null; poi(); };
    film.onended = fine; film.onerror = fine;
    var p = film.play(); if (p && p.catch) p.catch(function () { film.muted = true; var p2 = film.play(); if (p2 && p2.catch) p2.catch(fine); });
  }
  function bottone(testo, classe, fai) { var b = document.createElement('button'); b.className = 'btn ' + (classe || ''); b.textContent = testo; b.onclick = fai; return b; }

  // 1. la porta
  $('#avviso').textContent = denuncia ? 'Qualcuno ha sporto denuncia contro di te.' : 'C’è un caso a tuo carico.';
  $('#entra').onclick = function () {
