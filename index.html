<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFCF7" />
    <meta name="application-name" content="Hypemove" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Caratteri: gli stessi dell'app -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@700;800&family=Nunito:wght@400;700;800&display=swap" />

    <!-- Icone -->
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Titolo, descrizione, canonical, Open Graph e dati strutturati: li scrive
         scripts/prerender.mjs per ogni pagina, partendo dal `meta` esportato dalla pagina. -->
    <!--SEO-->
    <title>Hypemove</title>

    <!-- Google Analytics 4 con Consent Mode: parte "negato", si accende solo dopo il consenso -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      var hmConsent = null;
      try { hmConsent = localStorage.getItem('hmConsent'); } catch (e) {}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: hmConsent === 'granted' ? 'granted' : 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted'
      });
      (function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-VC77BXKJVM';
        document.head.appendChild(s);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Banner cookie -->
    <style>
      .hm-cookie { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 60; margin: 0 auto; max-width: 900px; background: #1E1B16; color: #F4EFE6; border-radius: 16px; padding: 14px 16px; box-shadow: 0 12px 30px rgba(0,0,0,.22); display: none; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; font-family: Nunito, system-ui, sans-serif; }
      .hm-cookie.show { display: flex; }
      .hm-cookie p { margin: 0; line-height: 1.5; font-size: 14px; max-width: 68%; }
      .hm-cookie a { color: #FBD9B8; text-decoration: underline; }
      .hm-actions { display: flex; gap: 8px; }
      .hm-btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 800; cursor: pointer; font-size: 14px; font-family: inherit; min-height: 44px; }
      .hm-btn-accept { background: #F27B0C; color: #fff; }
      .hm-btn-decline { background: #3A352D; color: #F4EFE6; }
      @media (max-width: 767px) {
        .hm-cookie p { max-width: 100%; }
        .hm-actions { width: 100%; }
        .hm-btn { flex: 1; }
        body.has-mobile-bar .hm-cookie { bottom: 92px; }
      }
    </style>
    <div id="hm-cookie" class="hm-cookie" role="dialog" aria-live="polite" aria-label="Consenso cookie">
      <p>
        Usiamo cookie per capire come viene usato il sito. Puoi accettare o rifiutare quelli statistici.
        Leggi la <a href="/legal/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.
      </p>
      <div class="hm-actions">
        <button id="hm-decline" class="hm-btn hm-btn-decline" type="button">Rifiuta</button>
        <button id="hm-accept" class="hm-btn hm-btn-accept" type="button">Accetta</button>
      </div>
    </div>

    <!-- Comportamenti del sito, senza framework: consenso, menu, tracciamento download -->
    <script>
      (function () {
        var banner = document.getElementById('hm-cookie');
        var stored = null;
        try { stored = localStorage.getItem('hmConsent'); } catch (e) {}
        function save(v) { try { localStorage.setItem('hmConsent', v); } catch (e) {} }
        function hide() { banner.classList.remove('show'); }
        function enableGA() {
          gtag('consent', 'update', { analytics_storage: 'granted' });
          gtag('js', new Date());
          gtag('config', 'G-VC77BXKJVM');
        }
        if (!stored) banner.classList.add('show');
        document.getElementById('hm-accept').addEventListener('click', function () { save('granted'); enableGA(); hide(); });
        document.getElementById('hm-decline').addEventListener('click', function () { save('denied'); gtag('consent', 'update', { analytics_storage: 'denied' }); hide(); });
        if (stored === 'granted') enableGA();

        // Barra fissa su telefono: il banner cookie si sposta sopra
        if (document.querySelector('.mobile-bar')) document.body.classList.add('has-mobile-bar');

        // Menu su telefono
        var toggle = document.querySelector('[data-menu-toggle]');
        var menu = document.getElementById('menu-mobile');
        if (toggle && menu) {
          toggle.addEventListener('click', function () {
            var open = menu.hidden;
            menu.hidden = !open;
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            toggle.setAttribute('aria-label', open ? 'Chiudi il menu' : 'Apri il menu');
          });
        }

        // Click sui bottoni "Scarica": evento GA4 download_android_click, poi navigazione
        document.addEventListener('click', function (event) {
          var link = event.target.closest('a[data-track="android"]');
          if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          if (typeof window.gtag !== 'function') return;
          event.preventDefault();
          var done = false;
          function go() { if (done) return; done = true; window.location.assign(link.href); }
          var timer = setTimeout(go, 600);
          gtag('event', 'download_android_click', {
            button_text: (link.textContent || '').trim(),
            location: link.getAttribute('data-location') || document.body.dataset.page || location.pathname,
            event_callback: function () { clearTimeout(timer); go(); },
            event_timeout: 600
          });
        });
      })();
    </script>
  </body>
</html>
